[package]
name = "knote-desktop"
version = "0.1.0"
description = "KNote para Windows"
authors = ["KNote"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "knote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
getrandom = "0.3"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
keyring-core = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2.12.1", features = [] }
zeroize = "1.8"
